<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>200 OK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-image: url('IMG_4104.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
            margin: 0;
            padding: 20px;
        }

        .card {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            padding: 50px 60px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        .oops {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .sub {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.8;
            margin-bottom: 20px;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .message {
            font-size: 0.95rem;
            opacity: 0.7;
            margin-bottom: 30px;
            line-height: 1.5;
            font-style: italic;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
        }

        .link a {
            display: inline-block;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 12px 32px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .link a:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.02);
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 24px;
                width: 90%;
            }
            .oops {
                font-size: 2rem;
            }
            .sub {
                font-size: 0.95rem;
            }
            .message {
                font-size: 0.8rem;
            }
            .link a {
                padding: 10px 24px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="oops">👋 Hi there</div>
        <div class="sub">
            IP <strong>187.188.11.75</strong><br />
            Mexico City, Totalplay<br />
            12 checks an hour for 30 days?
        </div>
        <div class="message">
            "You're not getting in. Ever. Thanks for the traffic, though."<br />
            <span style="font-size: 0.8rem; opacity: 0.5;">— fixseo.uk</span>
        </div>
        <div class="link"><a href="https://fixseo.uk">→ back to fixseo.uk</a></div>
    </div>
</body>
</html>
