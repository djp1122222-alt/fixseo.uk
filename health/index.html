<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fixseo.uk — Health Status</title>
    <style>
        /* Reset and full-page background */
        * {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            height: 100vh;
            background-image: url('IMG_4104.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Optional: Subtle overlay to make text pop */
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 0;
        }

        /* Text overlay on top of image */
        .status {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            padding: 20px;
        }

        .status h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: #0f0;
        }

        .status p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 6px;
        }

        .status .sub {
            font-size: 0.9rem;
            opacity: 0.5;
            color: #aaa;
            margin-top: 20px;
        }

        /* Easter egg for the hacker */
        .status .easter {
            font-size: 0.7rem;
            opacity: 0.2;
            margin-top: 30px;
            color: #888;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .status h1 {
                font-size: 2rem;
            }
            .status p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="status">
        <h1>✅ 200 OK</h1>
        <p>System: fully relaxed</p>
        <p>Status: 🌿</p>
        <p class="sub">— fixseo.uk / 2026</p>
        <p class="easter">
            <!-- To the hacker who spent 30 days scanning /health: -->
            <!-- You're welcome. Enjoy the view. -->
        </p>
    </div>

</body>
</html>
