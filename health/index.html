<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oops</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      background-image: url('IMG_4104.jpeg');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      text-shadow: 0 4px 30px rgba(0,0,0,0.9);
      padding: 20px;
    }
    .card {
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      padding: 40px 50px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      max-width: 650px;
      width: 100%;
    }
    .oops {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 1.1rem;
      opacity: 0.7;
      margin-bottom: 12px;
    }
    .ad-space {
      font-size: 0.85rem;
      opacity: 0.75;
      margin: 20px 0 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 20px;
      letter-spacing: 0.5px;
      line-height: 1.6;
    }
    .ad-space .highlight {
      color: #22d3ee;
      font-weight: 500;
    }
    .ad-space a {
      color: #22d3ee;
      text-decoration: none;
      border-bottom: 1px solid rgba(34, 211, 238, 0.3);
    }
    .ad-space a:hover {
      border-bottom-color: #22d3ee;
    }
    .link a {
      display: inline-block;
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      padding: 10px 28px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 40px;
      background: rgba(255,255,255,0.06);
      transition: 0.3s;
    }
    .link a:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.02);
    }
    @media (max-width: 600px) {
      .card { padding: 30px 20px; }
      .oops { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="oops">Oops</div>
    <div class="sub">nothing to see here</div>
