<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fixseo.uk — Health</title>
    <style>
        /* Full dark screen with image as background */
        * {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            height: 100vh;
            background-image: url('IMG_4104.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            position: relative;
        }

        /* Dark overlay to make text pop */
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
        }

        /* Status card on top of image */
        .status-container {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 50px 70px;
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 100, 0.2);
            box-shadow: 0 0 80px rgba(0, 255, 100, 0.08);
            text-align: center;
            transition: all 0.3s ease;
        }

        /* Glowing green dot */
        .dot {
            display: inline-block;
            width: 22px;
            height: 22px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 20px #00ff66, 0 0 60px #00ff6633;
            animation: pulse 2s infinite ease-in-out;
            margin-right: 14px;
            vertical-align: middle;
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 20px #00ff66, 0 0 40px #00ff6633;
            }
            50% {
                box-shadow: 0 0 30px #00ff66, 0 0 80px #00ff6655;
            }
        }

        .status {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 30px rgba(0, 255, 100, 0.2);
        }

        .sub {
            margin-top: 16px;
            font-size: 1rem;
            opacity: 0.5;
            color: #ccc;
            letter-spacing: 3px;
        }

        .status-code {
            margin-top: 24px;
            font-size: 0.8rem;
            opacity: 0.25;
            color: #aaa;
            letter-spacing: 2px;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .status-container {
                padding: 30px 24px;
                width: 85%;
            }
            .status {
                font-size: 1.6rem;
                flex-wrap: wrap;
            }
            .dot {
                width: 16px;
                height: 16px;
                margin-right: 10px;
            }
            .sub {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="status-container">
        <div class="status">
            <span class="dot"></span>
            <span>Fully Operational</span>
        </div>
        <div class="sub">— fixseo.uk / 2026</div>
        <div class="status-code">200 OK</div>
    </div>

</body>
</html>
