<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oops</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            background-image: url('health/IMG_4104.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #fff;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            flex-direction: column;
            gap: 20px;
        }

        .oops {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 40px;
            border-radius: 8px;
            backdrop-filter: blur(2px);
        }

        .link {
            font-size: 1.2rem;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 24px;
            border-radius: 8px;
            backdrop-filter: blur(2px);
        }

        .link a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .link a:hover {
            border-bottom: 1px solid #fff;
        }

        @media (max-width: 600px) {
            .oops {
                font-size: 3rem;
                padding: 16px 24px;
            }
            .link {
                font-size: 0.9rem;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="oops">Oops — nothing to see here</div>
    <div class="link">→ <a href="https://fixseo.uk">head to fixseo.uk</a></div>
</body>
</html>
